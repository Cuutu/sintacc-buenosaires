<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <title>Celimap</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0b1220;
        color: #f8fafc;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        padding-top: max(24px, env(safe-area-inset-top));
        padding-bottom: max(24px, env(safe-area-inset-bottom));
        text-align: center;
        box-sizing: border-box;
      }

      main {
        max-width: 360px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 24px;
        font-weight: 700;
      }

      p {
        margin: 0;
        color: #cbd5e1;
        line-height: 1.5;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Celimap</h1>
      <p>
        Necesitás conexión a internet para cargar el mapa de lugares sin TACC.
      </p>
    </main>
  </body>
</html>
