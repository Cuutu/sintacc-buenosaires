workflows:
  ios-testflight:
    name: Celimap iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Celimap
    environment:
      groups:
        - app_store_credentials
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.celimap.app"
        APP_STORE_APPLE_ID: "6797278308"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.celimap.app
      xcode: latest
    scripts:
      - name: Install npm deps
        script: |
          npm ci
      - name: Capacitor sync iOS
        script: |
          npx cap sync ios
      - name: Increment iOS build number
        script: |
          set -eo pipefail
          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"
          CURRENT=$(grep -m1 'CURRENT_PROJECT_VERSION' "$PBXPROJ" | sed 's/.*= \([0-9]*\);/\1/')
          LATEST=""
          if LATEST_OUT=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null); then
            LATEST="$LATEST_OUT"
          fi
          LATEST=$(echo "$LATEST" | tr -d '[:space:]')
          if ! [[ "$LATEST" =~ ^[0-9]+$ ]]; then
            LATEST="$CURRENT"
          fi
          NEW=$((LATEST + 1))
          if [ "$NEW" -le "$CURRENT" ]; then
            NEW=$((CURRENT + 1))
          fi
          echo "Build numbers — App Store latest: $LATEST, project: $CURRENT → uploading: $NEW"
          sed -i.bak "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $NEW;/g" "$PBXPROJ"
          rm -f "${PBXPROJ}.bak"
          grep CURRENT_PROJECT_VERSION "$PBXPROJ"
      - name: Build IPA
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  android-aab:
    name: Celimap Android AAB
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      groups:
        - android_credentials
      vars:
        PACKAGE_NAME: "com.celimap.app"
      java: 21
    scripts:
      - name: Install npm deps
        script: |
          npm ci
      - name: Capacitor sync Android
        script: |
          npx cap sync android
      - name: Write key.properties
        script: |
          cat <<EOF > android/key.properties
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF
      - name: Build release bundle
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
