workflows:
  ios-testflight:
    name: Celimap iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Celimap
    environment:
      groups:
        - app_store_credentials
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.celimap.app"
        APP_STORE_APPLE_ID: "6797278308"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.celimap.app
      xcode: latest
    scripts:
      - name: Install npm deps
        script: |
          npm ci
      - name: Capacitor sync iOS
        script: |
          npx cap sync ios
      - name: Increment iOS build number
        script: |
          set -eo pipefail
          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"
          CURRENT=$(grep -m1 'CURRENT_PROJECT_VERSION' "$PBXPROJ" | sed 's/.*= \([0-9]*\);/\1/')

          # TestFlight builds count too — get-latest-app-store-build-number ignores them
          TF=""
          AS=""
          if TF_OUT=$(app-store-connect get-latest-testflight-build-number --all-versions "$APP_STORE_APPLE_ID" 2>/dev/null); then
            TF=$(echo "$TF_OUT" | tr -d '[:space:]')
          fi
          if AS_OUT=$(app-store-connect get-latest-app-store-build-number --all-versions "$APP_STORE_APPLE_ID" 2>/dev/null); then
            AS=$(echo "$AS_OUT" | tr -d '[:space:]')
          fi

          LATEST=0
          for N in "$TF" "$AS" "$CURRENT"; do
            if [[ "$N" =~ ^[0-9]+$ ]] && [ "$N" -gt "$LATEST" ]; then
              LATEST=$N
            fi
          done

          NEW=$((LATEST + 1))
          echo "Build numbers — TestFlight: ${TF:-none}, App Store: ${AS:-none}, project: $CURRENT → uploading: $NEW"
          sed -i.bak "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $NEW;/g" "$PBXPROJ"
          rm -f "${PBXPROJ}.bak"
          grep CURRENT_PROJECT_VERSION "$PBXPROJ"
      - name: Build IPA
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  android-aab:
    name: Celimap Android AAB
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      groups:
        - android_credentials
      vars:
        PACKAGE_NAME: "com.celimap.app"
      java: 21
    scripts:
      - name: Install npm deps
        script: |
          npm ci
      - name: Capacitor sync Android
        script: |
          npx cap sync android
      - name: Write key.properties
        script: |
          cat <<EOF > android/key.properties
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF
      - name: Build release bundle
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
